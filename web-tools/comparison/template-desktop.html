<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Before & After (Desktop) — Garage Launch</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ── Brand tokens — swap these per client ── */
    :root {
      --accent:  #FFDA0F;
      --bg:      #0a0a0a;
      --white:   #ffffff;
      --muted:   rgba(255,255,255,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 5vw; }

    .gl-logo { font-family: 'Oswald', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 2.5rem; text-align: center; }
    .headline { font-family: 'Oswald', sans-serif; font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; text-align: center; line-height: 1; margin-bottom: .75rem; }
    .headline .hl { color: var(--accent); }
    .client-name { text-align: center; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); margin-bottom: 3.5rem; }

    /* ── Comparison layout ── */
    .comparison { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2rem; width: 100%; max-width: 1100px; }
    .side { display: flex; flex-direction: column; gap: 1.1rem; }
    .side-label { font-family: 'Oswald', sans-serif; font-size: .95rem; font-weight: 700; text-transform: uppercase; letter-spacing: .16em; }
    .side-label.before { color: var(--muted); }
    .side-label.after  { color: var(--accent); }

    /* ── Browser mockup ── */
    .browser {
      width: 100%;
      background: #141414;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .browser-bar {
      background: #222;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .browser-dots { display: flex; gap: 5px; }
    .browser-dots span { width: 10px; height: 10px; border-radius: 50%; background: #3a3a3a; }
    .browser-url { flex: 1; height: 22px; background: #111; border-radius: 4px; border: 1px solid rgba(255,255,255,0.07); }

    /* ── Iframe scaling ── */
    /* iframe renders at 1280px wide, scaled down to fit the browser container */
    .browser-screen {
      position: relative;
      width: 100%;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    .browser-screen iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      border: none;
      transform-origin: top left;
      pointer-events: none;
      /* JS sets transform: scale() based on container width */
    }

    /* ── "After" browser glow ── */
    .side.after .browser { border-color: var(--accent); box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px var(--accent), 0 0 40px rgba(255,218,15,0.12); }
    .side.after .browser-bar { border-bottom-color: rgba(255,218,15,0.15); }
    .side.after .browser-dots span:nth-child(1) { background: var(--accent); opacity: .7; }

    /* ── Badge ── */
    .after-badge { align-self: flex-start; background: var(--accent); color: var(--bg); font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; padding: .4rem 1.1rem; border-radius: 100px; }

    /* ── Arrow ── */
    .arrow { font-size: 2.2rem; color: var(--accent); text-align: center; flex-shrink: 0; }

    /* ── Footer ── */
    .tagline { margin-top: 3.5rem; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); text-align: center; }
    .tagline span { color: var(--accent); }

    @media (max-width: 700px) {
      .comparison { grid-template-columns: 1fr; }
      .arrow { transform: rotate(90deg); justify-self: center; }
    }
  </style>
</head>
<body>

  <p class="gl-logo">Garage Launch</p>
  <h1 class="headline">Before <span class="hl">&</span> After</h1>

  <!-- Swap CLIENT NAME -->
  <p class="client-name">CLIENT NAME — City, State</p>

  <div class="comparison">

    <!-- BEFORE -->
    <div class="side before">
      <span class="side-label before">Before</span>
      <div class="browser">
        <div class="browser-bar">
          <div class="browser-dots"><span></span><span></span><span></span></div>
          <div class="browser-url"></div>
        </div>
        <div class="browser-screen">
          <!-- Swap with their current website URL -->
          <!-- If it shows blank, their site blocks iframes — use a screenshot instead -->
          <img src = "../../clients/" alt="Before" />
        </div>
      </div>
    </div>

    <div class="arrow">→</div>

    <!-- AFTER -->
    <div class="side after">
      <span class="side-label after">After</span>
      <div class="browser">
        <div class="browser-bar">
          <div class="browser-dots"><span></span><span></span><span></span></div>
          <div class="browser-url"></div>
        </div>
        <div class="browser-screen">
          <!-- Swap with relative path to the built hero page -->
          <!-- e.g. ../../clients/barb-city-automotive/website/index.html -->
          <iframe src="../../clients/CLIENT-SLUG/website/index.html" title="After"></iframe>
        </div>
      </div>
      <span class="after-badge">Built by Garage Launch</span>
    </div>

  </div>

  <p class="tagline">We grow shops. <span>We run one too.</span></p>

  <script>
    function scaleIframes() {
      document.querySelectorAll('.browser-screen').forEach(wrap => {
        const iframe = wrap.querySelector('iframe');
        if (!iframe) return;
        const scale = wrap.clientWidth / 1280;
        iframe.style.transform = `scale(${scale})`;
      });
    }
    scaleIframes();
    window.addEventListener('resize', scaleIframes);
  </script>

</body>
</html>
