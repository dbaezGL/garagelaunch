<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Before & After — Garage Launch</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ── Brand tokens — swap these per client ── */
    :root {
      --accent:   #FFDA0F;   /* Garage Launch yellow */
      --accent2:  #e6c400;   /* darker yellow for hover */
      --bg:       #0a0a0a;
      --surface:  #111111;
      --border:   rgba(255,255,255,0.08);
      --white:    #ffffff;
      --muted:    rgba(255,255,255,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 5vw; }

    /* ── Header ── */
    .gl-logo { font-family: 'Oswald', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 2.5rem; text-align: center; }

    .headline { font-family: 'Oswald', sans-serif; font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; text-align: center; line-height: 1; margin-bottom: .75rem; }
    .headline .hl { color: var(--accent); }

    .client-name { text-align: center; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); margin-bottom: 3.5rem; }

    /* ── Comparison layout ── */
    .comparison { display: flex; align-items: center; justify-content: center; gap: 2.5rem; flex-wrap: wrap; width: 100%; max-width: 860px; }

    .side { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; flex: 1; min-width: 240px; }

    .side-label { font-family: 'Oswald', sans-serif; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .16em; }
    .side-label.before { color: var(--muted); }
    .side-label.after  { color: var(--accent); }

    /* ── Phone mockup ── */
    .phone-wrap { position: relative; width: 260px; flex-shrink: 0; }

    .phone {
      width: 100%;
      aspect-ratio: 9/19;
      background: #1a1a1a;
      border-radius: 36px;
      border: 7px solid #2a2a2a;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    /* Side button details */
    .phone::before {
      content: '';
      position: absolute;
      right: -10px;
      top: 22%;
      width: 4px;
      height: 12%;
      background: #2a2a2a;
      border-radius: 2px;
      z-index: 5;
    }

    /* Notch */
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 26px;
      background: #1a1a1a;
      border-radius: 0 0 18px 18px;
      z-index: 10;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* ── "After" phone gets accent glow ── */
    .side.after .phone {
      border-color: var(--accent);
      box-shadow: 0 24px 64px rgba(0,0,0,0.7), 0 0 0 1px var(--accent), 0 0 40px rgba(255,218,15,0.15);
    }

    /* ── Arrow ── */
    .arrow {
      font-size: 2.5rem;
      color: var(--accent);
      flex-shrink: 0;
      align-self: center;
      margin-top: 2rem;
    }

    /* ── Badge under "after" phone ── */
    .after-badge {
      background: var(--accent);
      color: var(--bg);
      font-size: .7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .14em;
      padding: .45rem 1.2rem;
      border-radius: 100px;
    }

    /* ── Footer tagline ── */
    .tagline {
      margin-top: 3.5rem;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--muted);
      text-align: center;
    }
    .tagline span { color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .comparison { gap: 2rem; }
      .arrow { transform: rotate(90deg); margin: 0; }
      .phone-wrap { width: 220px; }
    }
  </style>
</head>
<body>

  <p class="gl-logo">Garage Launch</p>

  <h1 class="headline">Before <span class="hl">&</span> After</h1>

  <!-- Swap CLIENT NAME below -->
  <p class="client-name">CLIENT NAME — City, State</p>

  <div class="comparison">

    <!-- BEFORE -->
    <div class="side before">
      <span class="side-label before">Before</span>
      <div class="phone-wrap">
        <div class="phone">
          <div class="phone-notch"></div>
          <!-- Swap src with screenshot of their old site -->
          <img class="phone-screen" src="before.png" alt="Before" />
        </div>
      </div>
    </div>

    <!-- Arrow -->
    <div class="arrow">→</div>

    <!-- AFTER -->
    <div class="side after">
      <span class="side-label after">After</span>
      <div class="phone-wrap">
        <div class="phone">
          <div class="phone-notch"></div>
          <!-- Swap src with screenshot of new hero -->
          <img class="phone-screen" src="after.png" alt="After" />
        </div>
      </div>
      <span class="after-badge">Built by Garage Launch</span>
    </div>

  </div>

  <p class="tagline">We grow shops. <span>We run one too.</span></p>

</body>
</html>
