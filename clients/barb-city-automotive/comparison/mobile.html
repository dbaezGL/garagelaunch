<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Before & After — Barb City Automotive</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ── Barb City brand colors ── */
    :root {
      --red:    #ad1416;
      --navy:   #01216c;
      --bg:     #010d28;
      --white:  #ffffff;
      --muted:  rgba(255,255,255,0.38);
      --gl-yellow: #FFDA0F;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 5vw;
      gap: 0;
    }

    /* ── Header ── */
    .gl-logo { font-family: 'Oswald', sans-serif; font-size: .65rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--gl-yellow); margin-bottom: 1.2rem; text-align: center; }
    .headline { font-family: 'Oswald', sans-serif; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; text-align: center; line-height: 1; margin-bottom: .5rem; }
    .headline .hl { color: var(--red); }
    .client-name { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .22em; color: var(--muted); margin-bottom: 2.5rem; text-align: center; }

    /* ── Comparison row ── */
    .comparison {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 2.5rem;
      flex-wrap: wrap;
      width: 100%;
      max-width: 820px;
    }
    .side { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .side-label { font-family: 'Oswald', sans-serif; font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .18em; }
    .side-label.before { color: var(--muted); }
    .side-label.after  { color: var(--red); }

    /* ── iPhone 14 Pro Max mockup (430×932) ── */
    .iphone {
      position: relative;
      width: 310px;
      aspect-ratio: 430 / 932;
      background: #000;
      border-radius: 50px;
      border: 2px solid #2e2e2e;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.07),
        0 0 0 1px rgba(0,0,0,0.9),
        0 36px 90px rgba(0,0,0,0.95),
        0 8px 20px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* Metallic sheen */
    .iphone::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(150deg, rgba(255,255,255,0.07) 0%, transparent 35%);
      pointer-events: none;
      z-index: 40;
    }

    /* Side buttons */
    .btn-left {
      position: absolute;
      left: -3px; top: 18%;
      width: 3px; height: 7%;
      background: #2e2e2e;
      border-radius: 2px 0 0 2px;
      z-index: 5;
    }
    .btn-left::before {
      content: '';
      position: absolute;
      top: -190%; left: 0;
      width: 100%; height: 160%;
      background: #2e2e2e;
      border-radius: 2px 0 0 2px;
    }
    .btn-right {
      position: absolute;
      right: -3px; top: 24%;
      width: 3px; height: 14%;
      background: #2e2e2e;
      border-radius: 0 2px 2px 0;
      z-index: 5;
    }

    /* ── Status bar ── */
    .phone-status {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 52px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px 0;
      pointer-events: none;
      /* Dark gradient so icons stay visible over any website nav color */
      background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 100%);
    }
    .status-time {
      font-size: 13px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -.3px;
      font-family: 'Inter', sans-serif;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ── Dynamic Island ── */
    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 104px;
      height: 30px;
      background: #000;
      border-radius: 18px;
      z-index: 31;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* ── Iframe inside phone ── */
    /* Phone inner width: 310 - 2*2 = 306px. Viewport: 430px. Scale = 306/430 = 0.712 */
    .screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 48px;
    }
    .screen-placeholder {
      position: absolute;
      inset: 0;
      background: #d4d4d4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      z-index: 0;
    }
    .screen-placeholder .ph-icon { font-size: 2.2rem; opacity: .25; }
    .screen-placeholder span { font-size: .6rem; color: #777; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; text-align: center; padding: 0 2rem; }
    .screen iframe {
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
      width: 430px;
      height: 932px;
      border: none;
      transform: scale(0.712);
      transform-origin: top left;
      pointer-events: none;
      display: block;
    }

    /* ── After phone — red glow ── */
    .side.after .iphone {
      border-color: var(--red);
      box-shadow:
        inset 0 0 0 1px rgba(173,20,22,0.15),
        0 0 0 1px rgba(173,20,22,0.5),
        0 0 55px rgba(173,20,22,0.22),
        0 36px 90px rgba(0,0,0,0.95);
    }

    /* ── Arrow ── */
    .arrow {
      font-size: 1.8rem;
      color: var(--red);
      flex-shrink: 0;
      align-self: center;
      opacity: .9;
      margin-top: 2rem;
    }

    /* ── Badge — always GL yellow ── */
    .after-badge {
      background: var(--gl-yellow);
      color: #0a0a0a;
      font-size: .63rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .16em;
      padding: .38rem 1rem;
      border-radius: 100px;
    }

    /* ── Footer ── */
    .tagline { margin-top: 2.5rem; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .22em; color: var(--muted); text-align: center; }
    .tagline span { color: var(--gl-yellow); }

    @media (max-width: 720px) {
      .comparison { flex-direction: column; align-items: center; gap: 1.5rem; }
      .arrow { transform: rotate(90deg); margin: 0; }
      .iphone { width: 260px; }
      /* 260 - 4 = 256px inner. Scale = 256/430 = 0.595 */
      .screen iframe { transform: scale(0.595); }
    }
  </style>
</head>
<body>

  <p class="gl-logo">Garage Launch</p>
  <h1 class="headline">Before <span class="hl">&</span> After</h1>
  <p class="client-name">Barb City Automotive — DeKalb, IL</p>

  <div class="comparison">

    <!-- BEFORE -->
    <div class="side before">
      <span class="side-label before">Before</span>
      <div class="iphone">
        <!-- Status bar -->
        <div class="phone-status">
          <span class="status-time">9:41</span>
          <div class="status-icons">
            <!-- Signal -->
            <svg width="17" height="12" viewBox="0 0 17 12" fill="white" opacity=".9">
              <rect x="0" y="7" width="3" height="5" rx="0.8"/>
              <rect x="4.5" y="5" width="3" height="7" rx="0.8"/>
              <rect x="9" y="2.5" width="3" height="9.5" rx="0.8"/>
              <rect x="13.5" y="0" width="3" height="12" rx="0.8"/>
            </svg>
            <!-- WiFi -->
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" opacity=".9">
              <circle cx="8" cy="11" r="1.5" fill="white"/>
              <path d="M4.8 8C5.9 6.9 6.9 6.3 8 6.3s2.1.6 3.2 1.7" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>
              <path d="M2 5C4 3 5.9 2 8 2s4 1 6 3" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>
            </svg>
            <!-- Battery -->
            <svg width="26" height="13" viewBox="0 0 26 13" fill="none" opacity=".9">
              <rect x="0.5" y="0.5" width="21" height="12" rx="3.5" stroke="white" stroke-opacity="0.45"/>
              <rect x="2" y="2" width="10" height="9" rx="2" fill="white"/>
              <path d="M23 4.5v4a2.5 2.5 0 000-4z" fill="white" fill-opacity="0.45"/>
            </svg>
          </div>
        </div>
        <div class="island"></div>
        <div class="btn-left"></div>
        <div class="btn-right"></div>
        <div class="screen">
          <div class="screen-placeholder">
            <span class="ph-icon">🌐</span>
            <span>barbcityautomotive.net</span>
          </div>
          <iframe src="https://barbcityautomotive.net" title="Before" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <div class="arrow">→</div>

    <!-- AFTER -->
    <div class="side after">
      <span class="side-label after">After</span>
      <div class="iphone">
        <div class="phone-status">
          <span class="status-time">9:41</span>
          <div class="status-icons">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="white" opacity=".9">
              <rect x="0" y="7" width="3" height="5" rx="0.8"/>
              <rect x="4.5" y="5" width="3" height="7" rx="0.8"/>
              <rect x="9" y="2.5" width="3" height="9.5" rx="0.8"/>
              <rect x="13.5" y="0" width="3" height="12" rx="0.8"/>
            </svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" opacity=".9">
              <circle cx="8" cy="11" r="1.5" fill="white"/>
              <path d="M4.8 8C5.9 6.9 6.9 6.3 8 6.3s2.1.6 3.2 1.7" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>
              <path d="M2 5C4 3 5.9 2 8 2s4 1 6 3" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>
            </svg>
            <svg width="26" height="13" viewBox="0 0 26 13" fill="none" opacity=".9">
              <rect x="0.5" y="0.5" width="21" height="12" rx="3.5" stroke="white" stroke-opacity="0.45"/>
              <rect x="2" y="2" width="16" height="9" rx="2" fill="white"/>
              <path d="M23 4.5v4a2.5 2.5 0 000-4z" fill="white" fill-opacity="0.45"/>
            </svg>
          </div>
        </div>
        <div class="island"></div>
        <div class="btn-left"></div>
        <div class="btn-right"></div>
        <div class="screen">
          <iframe src="../website/index.html" title="After" scrolling="no"></iframe>
        </div>
      </div>
      <span class="after-badge">Built by Garage Launch</span>
    </div>

  </div>

  <p class="tagline">We grow shops. <span>We run one too.</span></p>

</body>
</html>
