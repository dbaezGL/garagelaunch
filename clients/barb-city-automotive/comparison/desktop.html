<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Before & After (Desktop) — Barb City Automotive</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #FFDA0F;
      --bg:     #0a0a0a;
      --white:  #ffffff;
      --muted:  rgba(255,255,255,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 5vw; }

    .gl-logo { font-family: 'Oswald', sans-serif; font-size: .68rem; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem; text-align: center; }
    .headline { font-family: 'Oswald', sans-serif; font-size: clamp(2.4rem, 5vw, 4rem); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; text-align: center; line-height: 1; margin-bottom: .6rem; }
    .headline .hl { color: var(--accent); }
    .client-name { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .22em; color: var(--muted); margin-bottom: 3rem; text-align: center; }

    /* ── Comparison grid ── */
    .comparison { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2.5rem; width: 100%; max-width: 1200px; }
    .side { display: flex; flex-direction: column; gap: 1rem; }
    .side-label { font-family: 'Oswald', sans-serif; font-size: .9rem; font-weight: 700; text-transform: uppercase; letter-spacing: .18em; }
    .side-label.before { color: var(--muted); }
    .side-label.after  { color: var(--accent); }

    /* ── Browser mockup ── */
    .browser {
      width: 100%;
      background: #0d0d0d;
      border-radius: 12px;
      border: 1.5px solid #2a2a2a;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 24px 70px rgba(0,0,0,0.8),
        0 4px 16px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* Chrome bar */
    .browser-bar {
      background: #161616;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .browser-dots { display: flex; gap: 6px; }
    .browser-dots span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .browser-dots span:nth-child(1) { background: #ff5f57; }
    .browser-dots span:nth-child(2) { background: #febc2e; }
    .browser-dots span:nth-child(3) { background: #28c840; }

    .browser-url {
      flex: 1;
      height: 24px;
      background: #0a0a0a;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: .68rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: .02em;
    }

    /* ── Iframe screen ── */
    .browser-screen {
      position: relative;
      width: 100%;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    /* Placeholder shown if iframe is blocked */
    .browser-screen .screen-placeholder {
      position: absolute;
      inset: 0;
      background: #e8e8e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      z-index: 0;
    }
    .browser-screen .screen-placeholder span { font-size: .75rem; color: #888; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .browser-screen .screen-placeholder .ph-icon { font-size: 2.5rem; opacity: .25; }
    .browser-screen iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      border: none;
      transform-origin: top left;
      pointer-events: none;
      z-index: 1;
    }

    /* ── After glow ── */
    .side.after .browser {
      border-color: var(--accent);
      box-shadow:
        inset 0 0 0 1px rgba(255,218,15,0.08),
        0 0 0 1px rgba(255,218,15,0.35),
        0 0 50px rgba(255,218,15,0.14),
        0 24px 70px rgba(0,0,0,0.8);
    }
    .side.after .browser-bar { border-bottom-color: rgba(255,218,15,0.1); }
    .side.after .browser-dots span:nth-child(1) { background: var(--accent); opacity: .8; }
    .side.after .browser-dots span:nth-child(2) { background: var(--accent); opacity: .5; }
    .side.after .browser-dots span:nth-child(3) { background: var(--accent); opacity: .3; }

    /* ── Badge ── */
    .after-badge { align-self: flex-start; background: var(--accent); color: var(--bg); font-size: .65rem; font-weight: 800; text-transform: uppercase; letter-spacing: .16em; padding: .4rem 1.1rem; border-radius: 100px; }

    /* ── Arrow ── */
    .arrow { font-size: 2rem; color: var(--accent); text-align: center; flex-shrink: 0; opacity: .8; }

    /* ── Footer ── */
    .tagline { margin-top: 3rem; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .22em; color: var(--muted); text-align: center; }
    .tagline span { color: var(--accent); }

    @media (max-width: 768px) {
      .comparison { grid-template-columns: 1fr; }
      .arrow { transform: rotate(90deg); justify-self: center; }
    }
  </style>
</head>
<body>

  <p class="gl-logo">Garage Launch</p>
  <h1 class="headline">Before <span class="hl">&</span> After</h1>
  <p class="client-name">Barb City Automotive — DeKalb, IL</p>

  <div class="comparison">

    <!-- BEFORE -->
    <div class="side before">
      <span class="side-label before">Before</span>
      <div class="browser">
        <div class="browser-bar">
          <div class="browser-dots"><span></span><span></span><span></span></div>
          <div class="browser-url">barbcityautomotive.net</div>
        </div>
        <div class="browser-screen">
          <div class="screen-placeholder">
            <span class="ph-icon">🌐</span>
            <span>barbcityautomotive.net</span>
          </div>
          <iframe src="https://barbcityautomotive.net" title="Before"></iframe>
        </div>
      </div>
    </div>

    <div class="arrow">→</div>

    <!-- AFTER — live HTML, no screenshot needed -->
    <div class="side after">
      <span class="side-label after">After</span>
      <div class="browser">
        <div class="browser-bar">
          <div class="browser-dots"><span></span><span></span><span></span></div>
          <div class="browser-url">garagelaunch.com</div>
        </div>
        <div class="browser-screen">
          <iframe src="../website/index.html" title="After"></iframe>
        </div>
      </div>
      <span class="after-badge">Built by Garage Launch</span>
    </div>

  </div>

  <p class="tagline">We grow shops. <span>We run one too.</span></p>

  <script>
    function scaleIframes() {
      document.querySelectorAll('.browser-screen').forEach(wrap => {
        const iframe = wrap.querySelector('iframe');
        if (!iframe) return;
        iframe.style.transform = `scale(${wrap.clientWidth / 1280})`;
      });
    }
    scaleIframes();
    window.addEventListener('resize', scaleIframes);
  </script>

</body>
</html>
